blueprint:
  name: Outdoor lights with dark mode, first-activation memory and smart command suppression
  description: >
    Robust outdoor lighting blueprint.
    Turns lights on to an active brightness when one of the selected binary sensors is triggered.
    After the configured hold time, the lights return to a standby brightness or turn off,
    depending on darkness, the optional night schedule, and whether the lights have already
    been activated at least once during the current evening.

    Darkness can be evaluated by a sun-down binary sensor, a lux sensor threshold, or a combination of both.
    Light commands are only sent when the requested state is different from the current state.

  domain: automation
  source_url: https://github.com/math7935/Home-Assistant-Blueprints/blob/main/blueprints/automation/outdoor_lightning_with_standby_level_and_night_schedule.yaml

  input:
    # Sensors that trigger the light (motion, door, etc.)
    trigger_sensors:
      name: Trigger sensors
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    # Lights to control
    light_entities:
      name: Lights
      selector:
        entity:
          multiple: true
          filter:
            - domain: light

    # Sensor that defines "dark"
    sun_sensor:
      name: Sun sensor
      default: binary_sensor.sun_down
      selector:
        entity:
          filter:
            - domain: binary_sensor

    # Optional night schedule
    use_night_schedule:
      name: Use night schedule
      default: false
      selector:
        boolean: {}

    night_schedule:
      name: Night schedule
      default: schedule.nat_sluk_udendorslys
      selector:
        entity:
          filter:
            - domain: schedule

    # Brightness when triggered
    active_brightness:
      name: Active brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # Brightness after timer expires
    idle_brightness:
      name: Idle brightness
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # Prevents repeated commands due to small brightness differences
    brightness_tolerance:
      name: Brightness tolerance
      default: 4
      selector:
        number:
          min: 0
          max: 20

    # How long lights stay at active brightness
    hold_time:
      name: Hold time
      default: "00:05:00"
      selector:
        duration:

    # Fade time
    transition_time:
      name: Transition
      default: 2
      selector:
        number:
          min: 0
          max: 30

# Restart mode ensures new triggers reset the timer cleanly
mode: restart
max_exceeded: silent

variables:
  # Inputs
  use_night_schedule: !input use_night_schedule
  night_schedule_entity: !input night_schedule
  sun_sensor_entity: !input sun_sensor
  light_list: !input light_entities

  active_pct: !input active_brightness
  idle_pct: !input idle_brightness
  tolerance: !input brightness_tolerance

  # Convert % to HA brightness scale (0–255)
  target_active: "{{ (active_pct * 2.55) | round(0) }}"
  target_idle: "{{ (idle_pct * 2.55) | round(0) }}"

  # Determine if it's dark
  is_dark: "{{ is_state(sun_sensor_entity, 'on') }}"

  # Night schedule logic (optional)
  standby_allowed: >
    {{ not use_night_schedule or is_state(night_schedule_entity, 'off') }}

  # Check if lights need to be set to active brightness
  lights_need_active: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_active) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  # Check if lights need to be set to idle brightness
  lights_need_idle: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_idle) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  # Check if any lights are still on
  lights_need_off: >
    {{ expand(light_list) | selectattr('state','eq','on') | list | count > 0 }}

trigger:
  # Motion or activity detected
  - platform: state
    entity_id: !input trigger_sensors
    to: "on"
    id: motion

  # Sun state changes
  - platform: state
    entity_id: !input sun_sensor
    id: sun

  # Night schedule changes
  - platform: state
    entity_id: !input night_schedule
    id: schedule

  # When Home Assistant restarts
  - platform: homeassistant
    event: start
    id: startup

condition: []

action:
  - choose:
      # ===== MOTION TRIGGER =====
      - conditions:
          - condition: trigger
            id: motion
        sequence:
          # Only act if it's dark
          - if:
              - condition: template
                value_template: "{{ is_dark }}"
            then:
              # Set active brightness if needed
              - if:
                  - condition: template
                    value_template: "{{ lights_need_active }}"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entities
                    data:
                      brightness_pct: !input active_brightness
                      transition: !input transition_time

              # Wait before going to idle
              - delay: !input hold_time

              # Decide next state
              - if:
                  - condition: template
                    value_template: "{{ is_dark and standby_allowed }}"
                then:
                  # Set idle brightness if needed
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_idle }}"
                    then:
                      - service: light.turn_on
                        target:
                          entity_id: !input light_entities
                        data:
                          brightness_pct: !input idle_brightness
                          transition: !input transition_time
                else:
                  # Turn off if needed
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_off }}"
                    then:
                      - service: light.turn_off
                        target:
                          entity_id: !input light_entities
                        data:
                          transition: !input transition_time

    # ===== SYNC STATE (sun, schedule, restart) =====
    default:
      - if:
          - condition: template
            value_template: "{{ is_dark and standby_allowed }}"
        then:
          # Ensure idle brightness
          - if:
              - condition: template
                value_template: "{{ lights_need_idle }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: !input light_entities
                data:
                  brightness_pct: !input idle_brightness
                  transition: !input transition_time
        else:
          # Ensure lights are off
          - if:
              - condition: template
                value_template: "{{ lights_need_off }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: !input light_entities
                data:
                  transition: !input transition_time