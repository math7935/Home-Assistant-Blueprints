blueprint:
  name: Outdoor lights with dark mode, first-activation memory and smart command suppression
  description: >
    Robust outdoor lighting blueprint.
    Turns lights on to an active brightness when one of the selected binary sensors is triggered.
    After the configured hold time, the lights return to a standby brightness or turn off,
    depending on darkness, the optional night schedule, and whether the lights have already
    been activated at least once during the current evening.

    Darkness can be evaluated by a sun-down binary sensor, a lux sensor threshold, or a combination of both.
    Light commands are only sent when the requested state is different from the current state.

  domain: automation
  source_url: https://github.com/math7935/Home-Assistant-Blueprints/blob/main/blueprints/automation/outdoor_lightning_with_standby_level_and_night_schedule.yaml

  input:
    trigger_sensors:
      name: Trigger sensors
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    light_entities:
      name: Lights
      selector:
        entity:
          multiple: true
          filter:
            - domain: light

    darkness_mode:
      name: Darkness mode
      default: sun
      selector:
        select:
          options:
            - label: Sun only
              value: sun
            - label: Lux only
              value: lux
            - label: Sun OR lux
              value: sun_or_lux
            - label: Sun AND lux
              value: sun_and_lux

    sun_sensor:
      name: Sun sensor
      default: binary_sensor.sun_down
      selector:
        entity:
          filter:
            - domain: binary_sensor

    lux_sensor:
      name: Lux sensor
      selector:
        entity:
          filter:
            - domain: sensor

    lux_threshold:
      name: Lux threshold
      default: 20
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: lx

    use_night_schedule:
      name: Use night schedule
      default: false
      selector:
        boolean: {}

    night_schedule:
      name: Night schedule
      default: schedule.nat_sluk_udendorslys
      selector:
        entity:
          filter:
            - domain: schedule

    active_brightness:
      name: Active brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    idle_brightness:
      name: Idle brightness
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    brightness_tolerance:
      name: Brightness tolerance
      default: 4
      selector:
        number:
          min: 0
          max: 20

    hold_time:
      name: Hold time
      default: "00:05:00"
      selector:
        duration:

    transition_time:
      name: Transition
      default: 2
      selector:
        number:
          min: 0
          max: 30

mode: restart
max_exceeded: silent

variables:
  darkness_mode: !input darkness_mode
  use_night_schedule: !input use_night_schedule
  night_schedule_entity: !input night_schedule
  sun_sensor_entity: !input sun_sensor
  lux_sensor_entity: !input lux_sensor
  lux_threshold: !input lux_threshold
  light_list: !input light_entities

  active_pct: !input active_brightness
  idle_pct: !input idle_brightness
  tolerance: !input brightness_tolerance

  target_active: "{{ (active_pct * 2.55) | round(0) }}"
  target_idle: "{{ (idle_pct * 2.55) | round(0) }}"

  dark_by_sun: "{{ is_state(sun_sensor_entity, 'on') }}"
  lux_value: "{{ states(lux_sensor_entity) | float(none) }}"
  dark_by_lux: "{{ lux_value is not none and lux_value <= lux_threshold }}"

  is_dark: >-
    {% if darkness_mode == 'sun' %}
      {{ dark_by_sun }}
    {% elif darkness_mode == 'lux' %}
      {{ dark_by_lux }}
    {% elif darkness_mode == 'sun_or_lux' %}
      {{ dark_by_sun or dark_by_lux }}
    {% else %}
      {{ dark_by_sun and dark_by_lux }}
    {% endif %}

  standby_allowed: >
    {{ not use_night_schedule or is_state(night_schedule_entity, 'off') }}

  lights_need_active: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_active) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  lights_need_idle: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_idle) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  lights_need_off: >
    {{ expand(light_list) | selectattr('state','eq','on') | list | count > 0 }}

trigger:
  - platform: state
    entity_id: !input trigger_sensors
    to: "on"

  - platform: state
    entity_id: !input sun_sensor

  - platform: state
    entity_id: !input lux_sensor

  - platform: state
    entity_id: !input night_schedule

  - platform: homeassistant
    event: start

condition: []

action:
  - choose:
      # Motion trigger
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'state' and trigger.to_state.state == 'on' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_dark }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ lights_need_active }}"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entities
                    data:
                      brightness_pct: !input active_brightness
                      transition: !input transition_time

              - delay: !input hold_time

              - if:
                  - condition: template
                    value_template: "{{ is_dark and standby_allowed }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_idle }}"
                    then:
                      - service: light.turn_on
                        target:
                          entity_id: !input light_entities
                        data:
                          brightness_pct: !input idle_brightness
                          transition: !input transition_time
                else:
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_off }}"
                    then:
                      - service: light.turn_off
                        target:
                          entity_id: !input light_entities
                        data:
                          transition: !input transition_time

    default:
      - if:
          - condition: template
            value_template: "{{ is_dark and standby_allowed }}"
        then:
          - if:
              - condition: template
                value_template: "{{ lights_need_idle }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: !input light_entities
                data:
                  brightness_pct: !input idle_brightness
                  transition: !input transition_time
        else:
          - if:
              - condition: template
                value_template: "{{ lights_need_off }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: !input light_entities
                data:
                  transition: !input transition_time