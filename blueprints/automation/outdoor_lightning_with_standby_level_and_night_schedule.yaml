blueprint:
  name: Outdoor lights with dark mode, first-activation memory and smart command suppression
  description: >
    Robust outdoor lighting blueprint.
    Turns lights on to an active brightness when one of the selected binary sensors is triggered.
    After the configured hold time, the lights return to a standby brightness or turn off,
    depending on darkness, the optional night schedule, and whether the lights have already
    been activated at least once during the current evening.

    Darkness can be evaluated by a sun-down binary sensor, a lux sensor threshold, or a combination of both.
    Light commands are only sent when the requested state is different from the current state.

  domain: automation
  source_url: https://github.com/math7935/Home-Assistant-Blueprints/blob/main/blueprints/automation/outdoor_lightning_with_standby_level_and_night_schedule.yaml

  input:
    trigger_sensors:
      name: Trigger sensors
      description: >
        Binary sensors that will activate the lights (motion, vehicle, door, etc.).
        When any of these turns ON, the lights will activate.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    light_entities:
      name: Lights
      description: >
        Lights that will be controlled by this automation.
        All selected lights will be treated as one group.
      selector:
        entity:
          multiple: true
          filter:
            - domain: light

    sun_sensor:
      name: Sun sensor
      description: >
        Binary sensor that indicates darkness.
        Must be ON when it is dark and OFF when it is daylight.
      default: binary_sensor.sun_down
      selector:
        entity:
          filter:
            - domain: binary_sensor

    use_night_schedule:
      name: Use night schedule
      description: >
        Enable this if you want a schedule to fully disable the lights.
        When enabled and the schedule is ON, lights will be turned OFF instead of dimmed.
      default: false
      selector:
        boolean: {}

    night_schedule:
      name: Night schedule
      description: >
        Schedule helper used when "Use night schedule" is enabled.
        When the schedule is ON, lights will be forced OFF.
        When OFF, standby brightness is allowed.
      default: schedule.nat_sluk_udendorslys
      selector:
        entity:
          filter:
            - domain: schedule

    active_brightness:
      name: Active brightness
      description: >
        Brightness level used when the lights are triggered.
        Typically set to 100% for full illumination.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    idle_brightness:
      name: Idle brightness
      description: >
        Brightness level used after the hold time expires.
        This is your "standby" or background light level.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    brightness_tolerance:
      name: Brightness tolerance
      description: >
        Prevents unnecessary commands.
        If the current brightness is within this range of the target,
        no new command will be sent.
      default: 4
      selector:
        number:
          min: 0
          max: 20

    hold_time:
      name: Hold time
      description: >
        How long the lights stay at active brightness after a trigger.
        Each new trigger restarts this timer.
      default: "00:05:00"
      selector:
        duration:

    transition_time:
      name: Transition
      description: >
        Fade time in seconds when changing brightness or turning lights on/off.
      default: 2
      selector:
        number:
          min: 0
          max: 30

mode: restart
max_exceeded: silent

variables:
  use_night_schedule: !input use_night_schedule
  night_schedule_entity: !input night_schedule
  sun_sensor_entity: !input sun_sensor
  light_list: !input light_entities

  active_pct: !input active_brightness
  idle_pct: !input idle_brightness
  tolerance: !input brightness_tolerance

  target_active: "{{ (active_pct * 2.55) | round(0) }}"
  target_idle: "{{ (idle_pct * 2.55) | round(0) }}"

  is_dark: "{{ is_state(sun_sensor_entity, 'on') }}"

  standby_allowed: >
    {{ not use_night_schedule or is_state(night_schedule_entity, 'off') }}

  lights_need_active: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_active) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  lights_need_idle: >-
    {% set ns = namespace(need=false) %}
    {% for l in expand(light_list) %}
      {% set b = state_attr(l.entity_id, 'brightness') | int(-1) %}
      {% if l.state != 'on' or b == -1 or (b - target_idle) | abs > tolerance %}
        {% set ns.need = true %}
      {% endif %}
    {% endfor %}
    {{ ns.need }}

  lights_need_off: >
    {{ expand(light_list) | selectattr('state','eq','on') | list | count > 0 }}

trigger:
  - platform: state
    entity_id: !input trigger_sensors
    to: "on"
    id: motion

  - platform: state
    entity_id: !input sun_sensor
    id: sun

  - platform: state
    entity_id: !input night_schedule
    id: schedule

  - platform: homeassistant
    event: start
    id: startup

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_dark }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ lights_need_active }}"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entities
                    data:
                      brightness_pct: !input active_brightness
                      transition: !input transition_time

              - delay: !input hold_time

              - if:
                  - condition: template
                    value_template: "{{ is_dark and standby_allowed }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_idle }}"
                    then:
                      - service: light.turn_on
                        target:
                          entity_id: !input light_entities
                        data:
                          brightness_pct: !input idle_brightness
                          transition: !input transition_time
                else:
                  - if:
                      - condition: template
                        value_template: "{{ lights_need_off }}"
                    then:
                      - service: light.turn_off
                        target:
                          entity_id: !input light_entities
                        data:
                          transition: !input transition_time

    default:
      - if:
          - condition: template
            value_template: "{{ is_dark and standby_allowed }}"
        then:
          - if:
              - condition: template
                value_template: "{{ lights_need_idle }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: !input light_entities
                data:
                  brightness_pct: !input idle_brightness
                  transition: !input transition_time
        else:
          - if:
              - condition: template
                value_template: "{{ lights_need_off }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: !input light_entities
                data:
                  transition: !input transition_time